services:
  db:
    image: postgres:16-alpine
    container_name: datawise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datawise}
      POSTGRES_USER: ${POSTGRES_USER:-datawise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - datawise_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datawise} -d ${POSTGRES_DB:-datawise}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: datawise-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-datawise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-datawise}
      STORAGE_PATH: /app/storage
      # The browser accesses the API through the host-published port.
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - datawise_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: datawise-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  datawise_postgres:
  datawise_storage:
